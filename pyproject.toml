[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "offline"
version = "0.1.0"
description = "Cited answers over public federal regulations, with a fully offline mode."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=6.21.4,<7",
    "defusedxml>=0.7,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
    "types-defusedxml",
    "pip-audit>=2.7",
]

[project.scripts]
offline = "offline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["offline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
packages = ["offline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
