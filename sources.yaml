# Only sources listed here can be fetched or ingested.
#
# FAR text comes from the eCFR versioner API, pinned to one date so answers are
# reproducible. Change the date in both url and cite_url to move to a new version.
#
# marking:
#   public_domain   public domain text from an allowed host
#   public_release  the file must say it is approved for public release or ingest refuses it

allowed_hosts:
  - www.ecfr.gov

sources:
